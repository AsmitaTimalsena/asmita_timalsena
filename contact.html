<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Asmita Timalsena</title>

    <link href="https://fonts.googleapis.com/css?family=Istok+Web&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Istok Web', sans-serif;
            background-color: lightslategray;
        }

        .page {
            max-width: 800px;
            margin: auto;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        .contact-box {
            background: #7fb4cf;
            padding: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: none;
        }

        textarea {
            height: 120px;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background: #6fa8c7;
            border: none;
            cursor: pointer;
        }
        #sendButton{
            background:lightcyan;;
        }
        #sendButton:hover {
            background:lightslategray;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            margin-top: 15px;
        }
    </style>


    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

</head>

<body>

    <div class="page">

        <h1>Contact Me</h1>

        <div class="contact-box">

            <form id="contactForm">

                <label>Name</label>
                <input type="text" id="name">
                <div id="nameError" class="error"></div>

                <label>Email</label>
                <input type="email" id="email">
                <div id="emailError" class="error"></div>

                <label>Message</label>
                <textarea id="message"></textarea>
                <div id="messageError" class="error"></div>

                <button type="submit" id="sendButton">Send Message</button>

                <div id="successMessage" class="success"></div>

            </form>

        </div>

    </div>

    <script>

        (function () {
            emailjs.init("YOUR_PUBLIC_KEY");
        })();

        document.getElementById("contactForm").addEventListener("submit", function (e) {

            e.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let message = document.getElementById("message").value.trim();

            let valid = true;


            document.getElementById("nameError").innerText = "";
            document.getElementById("emailError").innerText = "";
            document.getElementById("messageError").innerText = "";


            if (name === "") {
                document.getElementById("nameError").innerText = "Name is required";
                valid = false;
            }

            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (email === "") {
                document.getElementById("emailError").innerText = "Email is required";
                valid = false;
            }
            else if (!email.match(emailPattern)) {
                document.getElementById("emailError").innerText = "Enter valid email";
                valid = false;
            }


            if (message === "") {
                document.getElementById("messageError").innerText = "Message cannot be empty";
                valid = false;
            }

            if (!valid) return;


            emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                from_name: name,
                from_email: email,
                message: message
            })
                .then(function () {

                    document.getElementById("successMessage").innerText = "Message sent successfully!";
                    document.getElementById("contactForm").reset();

                },
                    function (error) {

                        alert("Failed to send message");

                    });

        });

    </script>

</body>

</html>
